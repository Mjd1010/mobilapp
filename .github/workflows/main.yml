name: Build Flet APK
on: [push] # سيعمل البناء تلقائياً بمجرد رفع الكود

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Flet and Flutter
        run: |
          pip install flet
          sudo apt-get update
          sudo apt-get install -y curl git unzip xz-utils zip libglu1-mesa
          
      - name: Flet Build APK
        run: |
          flet build apk
          
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: build/apk/*.apk
