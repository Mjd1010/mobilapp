name: Build Flet APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Install Flet
        run: pip install flet

      - name: Flet Build APK
        run: |
          # هنا نضيف صلاحيات سجل المكالمات مباشرة أثناء البناء
          flet build apk --android-permissions "android.permission.READ_CALL_LOG,android.permission.READ_PHONE_STATE"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FraudShield-APK
          path: build/apk/*.apk
