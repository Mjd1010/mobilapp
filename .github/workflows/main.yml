name: Build Flet Android App
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # إضافة جافا (مهم جداً لبناء الأندرويد)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flet CLI
        run: |
          pip install flet

      - name: Build Android APK
        run: |
          # إضافة --verbose عشان لو فشل يعطينا السبب الدقيق
          flet build apk --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-call-security-app
          path: build/apk/*.apk
