name: Build Flet APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet
        run: |
          pip install flet
          
      - name: Flet Build APK
        run: |
          flet build apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4 # تم التحديث هنا من v3 إلى v4
        with:
          name: my-flet-app
          path: build/apk/*.apk
