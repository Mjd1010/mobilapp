name: Build Flet APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0' # إصدار مستقر ومجرب مع Flet
          channel: 'stable'

      - name: Install Flet
        run: |
          pip install flet
          
      - name: Build APK
        run: |
          # هذا الأمر يقوم بكل السحر وتجاوز مشاكل البيئة
          flet build apk --no-version-check

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flet-app-release
          path: build/apk/*.apk
