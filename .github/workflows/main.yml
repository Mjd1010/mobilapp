name: Build Flet Android App
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # تم التحديث لـ v4

      - name: Set up Python
        uses: actions/setup-python@v5 # تم التحديث لـ v5
        with:
          python-version: '3.10'

      - name: Install Flet CLI
        run: |
          pip install flet

      - name: Build Android APK
        run: |
          flet build apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4 # هذا هو التعديل الأهم (v4)
        with:
          name: my-call-security-app
          path: build/apk/*.apk
